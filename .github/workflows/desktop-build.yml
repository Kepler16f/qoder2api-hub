name: Desktop builds

# 桌面客户端多平台构建（5 条产线，覆盖 6 类设备），产物为安装包：
#   windows-latest   → Qoder2API-Hub-setup-windows-x64.exe   （Inno Setup，按用户安装）
#   windows-11-arm   → Qoder2API-Hub-setup-windows-arm64.exe （原生 WOA，Inno 6.7 的
#                                                       安装器本体为 x86，WOA 仿真可跑）
#   macos-14         → Qoder2API-Hub-macos-arm64.dmg         （ad-hoc 签名 + DMG）
#   ubuntu-22.04     → qoder2api-hub-linux-x64.deb           （pywebview+WebKit2GTK）
#   ubuntu-24.04-arm → qoder2api-hub-linux-arm64.deb         （同上，系统库不进包）
#
# GUI 不在 CI 里自动化（无显示服务器），每条产线以 --smoke-test 无头冒烟为准；
# GUI/深色模式/安装卸载链路已在 WOA 真机人工验证。
#
# 打 v* tag 时自动把 5 个安装包发布到 GitHub Release；手动触发仅出 artifacts。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: windows-x64,   py: "3.12" }
          - { os: windows-11-arm,   target: windows-arm64, py: "3.12" }
          - { os: macos-14,         target: macos-arm64,   py: "3.12" }
          - { os: ubuntu-22.04,     target: linux-x64,     py: "3.12" }
          - { os: ubuntu-24.04-arm, target: linux-arm64,   py: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Show environment
        run: |
          python --version
          python -c "import platform; print(platform.machine())"
          python -m pip --version

      # Linux：Qt 运行库（PyInstaller 分析/收集 PySide6 扩展时需要其依赖存在）；
      # glib 包名 22.04 与 24.04 不同（libglib2.0-0 / t64 后缀），逐个尝试。
      - name: Install Linux GUI runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          sudo apt-get install -y --no-install-recommends libglib2.0-0 \
            || sudo apt-get install -y --no-install-recommends libglib2.0-0t64 \
            || true

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # 每个平台只装它内嵌 UI 需要的依赖（壳代码按平台自适应）：
          if [ "${{ runner.os }}" = "macOS" ]; then
            python -m pip install pywebview          # WKWebView 后端（pyobjc 随装）
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # PyGObject 钉 3.50：3.51+ 要求 girepository-2.0 开发库（22.04 无），
            # 3.50 走 1.0 API；dev 头文件供无轮子时源码构建。
            sudo apt-get update -qq
            sudo apt-get install -y -qq libgirepository1.0-dev pkg-config
            python -m pip install pywebview "PyGObject==3.50.0"
          fi
          # Windows 不需要任何 GUI 依赖：tkinter 内置 + WebView2 宿主为纯 ctypes

      # UMID 组件（每日 Credits 活动的真身识别）。Windows 产线跳过——官方
      # 组件在 npm 包里只有 PE x64 且 _install_umid.py 明确不服务 win32；
      # Windows 用户装着官方 Qoder 客户端时网关会自动发现它（README 有说明）。
      - name: Extract UMID component (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux-x64)   ARCH=x86_64; PLAT=linux  ;;
            linux-arm64) ARCH=aarch64; PLAT=linux ;;
            macos-arm64) ARCH=arm64;   PLAT=darwin ;;
          esac
          python _install_umid.py --platform "$PLAT" --arch "$ARCH" --dest umid \
            || echo "WARN: UMID extraction failed; gateway falls back (chat 不受影响)"

      - name: Build app (PyInstaller)
        run: python -m PyInstaller desktop/qoder2api-hub.spec --noconfirm

      # 无头冒烟：起网关 → /health → /v1/models → / → 优雅停机（打包前的质量门）
      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            BIN="dist/Qoder2API-Hub.app/Contents/MacOS/Qoder2API-Hub"
          else
            BIN="dist/Qoder2API-Hub"
            [ "${{ runner.os }}" = "Windows" ] && BIN="dist/Qoder2API-Hub.exe"
          fi
          "$BIN" --smoke-test --port 8799
          echo "smoke exit=$?"
          # Linux：GUI 整链冒烟（pywebview -> PyGObject -> GTK -> WebKit2GTK）。
          # xvfb 提供无头显示；webkit2gtk 是运行期系统依赖（构建机装它只为冒烟）。
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb gir1.2-webkit2-4.1 gir1.2-gtk-3.0               || sudo apt-get install -y -qq xvfb gir1.2-webkit2-4.0 gir1.2-gtk-3.0
            xvfb-run -a "$BIN" --smoke-gui --auto-close-ms 20000
            echo "gui smoke exit=$?"
          fi

      # ---------------- 安装包 ----------------
      - name: Version string
        id: ver
        shell: bash
        run: |
          # v1.2.18 → 1.2.18；v1.2.17-2-gHASH → 1.2.17.2；无 tag → 0.0.0+short
          RAW=$(git describe --tags --always 2>/dev/null || echo v0)
          V=$(echo "$RAW" | sed -e 's/^v//' -e 's/-g[0-9a-f]*$//' \
              -e 's/-\([0-9]\+\)$/.\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version: $RAW -> $V"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            # windows-11-arm 产线未预装 Inno：下载 6.7.3（安装器本体 x86，
            # WOA 仿真可跑），按用户级别静默安装
            curl.exe -sL -o innosetup.exe `
              "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            Start-Process -Wait -FilePath .\innosetup.exe -ArgumentList `
              '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER'
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          $arch = if ("${{ matrix.target }}" -eq "windows-arm64") { "arm64" } `
                  else { "x64" }
          & $iscc "-DAppVersion=${{ steps.ver.outputs.version }}" `
                  "-DArchTag=$arch" desktop/installer/qoder2api-hub.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # .iss 固定输出到 installer-out/，复制到根目录供 upload-artifact 收集
          Copy-Item "installer-out\Qoder2API-Hub-setup-windows-*.exe" . -Force
          Get-Item "Qoder2API-Hub-setup-windows-*.exe" | Select-Object Name, Length

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Qoder2API-Hub.app
          mkdir -p dmg
          cp -R dist/Qoder2API-Hub.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Qoder2API-Hub" -srcfolder dmg -ov \
            -format UDZO "Qoder2API-Hub-macos-arm64.dmg"

      - name: Build Linux deb
        if: runner.os == 'Linux'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # Debian 版本号不允许下划线：_R 后缀清洗为 +R（Inno/DMG 原样用 VER）
          VER_DEB=$(echo "$VER" | tr '_' '+')
          case "${{ matrix.target }}" in
            linux-x64)   DEBARCH=amd64; PKGARCH=x64   ;;
            linux-arm64) DEBARCH=arm64; PKGARCH=arm64 ;;
          esac
          ROOT="pkg/qoder2api-hub"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/qoder2api-hub" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps"
          install -m 755 dist/Qoder2API-Hub \
                         "$ROOT/opt/qoder2api-hub/Qoder2API-Hub"
          install -m 644 desktop/assets/qoder2api.png \
                         "$ROOT/usr/share/icons/hicolor/256x256/apps/qoder2api-hub.png"
          cat > "$ROOT/usr/share/applications/qoder2api-hub.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Qoder2API-Hub
          Comment=Qoder -> OpenAI 兼容网关（内嵌看板）
          Exec=/opt/qoder2api-hub/Qoder2API-Hub
          Icon=qoder2api-hub
          Categories=Development;Network;
          EOF
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: qoder2api-hub
          Version: $VER_DEB
          Section: net
          Priority: optional
          Architecture: $DEBARCH
          Maintainer: Kepler16f
          Depends: libgtk-3-0, gir1.2-gtk-3.0, gir1.2-webkit2-4.1 | gir1.2-webkit2-4.0
          Description: Qoder2API-Hub 桌面客户端（内嵌看板的 OpenAI 兼容网关）
           安装到 /opt/qoder2api-hub；数据目录在 $HOME/.local/share/qoder2api-hub
           （安装目录只读时桌面壳自动回退）。内嵌 UI 用系统 WebKit2GTK
           （Ubuntu 22.04 为 4.0、24.04+ 为 4.1，Depends 已声明两者）；
           缺依赖时自动回退控制台模式。
          EOF
          dpkg-deb --build --root-owner-group "$ROOT" \
            "qoder2api-hub-linux-${PKGARCH}.deb"

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: Qoder2API-Hub-${{ matrix.target }}
          path: |
            Qoder2API-Hub-setup-windows-*.exe
            Qoder2API-Hub-macos-*.dmg
            qoder2api-hub-linux-*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (release notes file)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la rel/
          # 发布说明优先取仓库内 release-notes/<tag>.md；缺失时用内置兜底文案
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Qoder2API-Hub Desktop $GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              rel/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Qoder2API-Hub Desktop $GITHUB_REF_NAME" \
              --notes "桌面客户端多平台安装包，安装与首次运行说明见 desktop/README.md。

          - Windows x64 / ARM64：Inno Setup 安装包，按用户安装（无需管理员），
            双击即用；可选桌面快捷方式
          - macOS Apple Silicon：DMG，拖进 Applications；首跑右键打开绕过 Gatekeeper
          - Linux x64 / ARM64：deb 包（sudo dpkg -i），装完在应用列表启动" \
              rel/*
          fi
